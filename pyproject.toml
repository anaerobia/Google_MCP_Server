[project]
name = "gcal-mcp"
version = "1.0.0"
description = "An MCP server exposing Google Calendar to coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
gcal-mcp = "gcal_mcp.server:main"
gcal-mcp-login = "gcal_mcp.login_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcal_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
